<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet</title>
  <link rel="stylesheet" href="/pixel.css" />
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0" integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body x-data="dashboardApp()" x-cloak :class="{ 'chat-open': chatOpen }">
  <header class="mast">
    <div class="mast-captain">
      <img class="portrait mast-face" src="/art/captain.png" width="56" height="56" alt="" />
      <h1>Fleet</h1>
    </div>
    <p class="muted mast-hint"><kbd>⌘K</kbd> command</p>
  </header>

  <nav class="leaf-tabs" role="tablist" aria-label="Fleet sections">
    <button type="button" class="tab" role="tab" id="tab-health" aria-controls="leaf-health"
            :aria-selected="leaf === 'health'" :class="{ 'is-open': leaf === 'health' }"
            @click="openLeaf('health')"><span class="punch" aria-hidden="true"></span>Health</button>
    <button type="button" class="tab" role="tab" id="tab-fleet" aria-controls="leaf-fleet"
            :aria-selected="leaf === 'fleet'" :class="{ 'is-open': leaf === 'fleet', 'is-ring': waiting }"
            @click="openLeaf('fleet')"><span class="punch" aria-hidden="true"></span>Fleet</button>
    <button type="button" class="tab" role="tab" id="tab-agents" aria-controls="leaf-agents"
            :aria-selected="leaf === 'agents'" :class="{ 'is-open': leaf === 'agents', 'is-ring': waiting }"
            @click="openLeaf('agents')"><span class="punch" aria-hidden="true"></span>Agents</button>
  </nav>

  <main>
    <section id="leaf-health" class="leaf" role="tabpanel" aria-labelledby="tab-health"
             :class="{ 'is-open': leaf === 'health', 'is-hinge': hinge === 'health' }">
      <h2>Health</h2>
      <aside class="slip" x-show="waitSummary" x-cloak>
        <p x-text="waitSummary"></p>
      </aside>
      <div class="stack">
        <div id="usage" hx-get="/partials/usage" hx-trigger="load" hx-swap="innerHTML"></div>
        <div id="metrics" hx-get="/partials/metrics" hx-trigger="load" hx-swap="innerHTML"></div>
      </div>
    </section>

    <section id="leaf-fleet" class="leaf" role="tabpanel" aria-labelledby="tab-fleet"
             :class="{ 'is-open': leaf === 'fleet', 'is-hinge': hinge === 'fleet' }">
      <h2>Fleet</h2>
      <aside class="slip" x-show="waitSummary" x-cloak>
        <p x-text="waitSummary"></p>
      </aside>
      <div id="fleet" hx-get="/partials/fleet" hx-trigger="load" hx-swap="innerHTML"></div>
    </section>

    <section id="leaf-agents" class="leaf" role="tabpanel" aria-labelledby="tab-agents"
             :class="{ 'is-open': leaf === 'agents', 'is-hinge': hinge === 'agents' }">
      <h2>Agents</h2>
      <div class="grid-2">
        <div id="agents" hx-get="/partials/agents" hx-trigger="load" hx-swap="innerHTML"></div>
        <div id="groups" hx-get="/partials/groups" hx-trigger="load" hx-swap="innerHTML"></div>
      </div>
    </section>

  </main>

  <nav class="rail" aria-label="Chat">
    <template x-for="t in rail.agents" :key="t.id">
      <button type="button" class="rail-face" :class="{ 'is-open': chatOpen && !chatGroup && chatId === t.id, 'is-busy': t.thinking }"
              :aria-label="'Chat with ' + t.label" :title="t.description ? t.label + ' · ' + t.description : t.label" @click="openChat(t.id)">
        <img x-show="t.art" :src="t.art" width="44" height="44" alt="" />
        <span x-show="!t.art" x-text="initials(t)"></span>
      </button>
    </template>
    <p class="rail-label" x-show="groups.length" x-cloak>Groups</p>
    <template x-for="g in groups" :key="g.id">
      <button type="button" class="rail-face rail-group" :class="{ 'is-open': chatOpen && chatGroup && chatGroup.id === g.id }"
              :aria-label="'Open group ' + g.name" :title="g.name + ' · lead ' + g.lead" @click="openGroup(g.id)">
        <template x-for="(f, i) in groupFaces(g)" :key="f.id">
          <span class="stack-face" :style="'--i:' + i"><img x-show="f.art" :src="f.art" alt="" /><span x-show="!f.art" x-text="initials(f)"></span></span>
        </template>
      </button>
    </template>
    <p class="rail-label" x-show="rail.workers.length" x-cloak>Crew</p>
    <template x-for="t in rail.workers" :key="t.id">
      <button type="button" class="rail-face rail-worker" :class="{ 'is-open': chatOpen && chatId === t.id }"
              :aria-label="'Chat with ' + (t.role || 'worker') + ' ' + t.label" :title="t.label + ' · ' + [t.role, t.state].filter(Boolean).join(' · ')" @click="openChat(t.id)">
        <img x-show="t.art" :src="t.art" width="34" height="34" alt="" />
        <span x-show="!t.art" x-text="initials(t)"></span>
      </button>
    </template>
  </nav>

  <button type="button" class="rail-toggle" :class="{ 'is-open': chatOpen }" aria-label="Open chat" @click="toggleChat()">
    <img class="fab-face" :src="current().art || '/art/captain.png'" width="32" height="32" alt="" />
    <span class="fab-label">Chat</span>
  </button>

  <aside id="chat-drawer" class="chat-drawer" role="dialog" aria-modal="true" aria-labelledby="chat-title"
         :class="{ 'is-open': chatOpen }" :aria-hidden="chatOpen ? 'false' : 'true'" :inert="!chatOpen">
    <header class="chat-bar">
      <div class="chat-who">
        <img class="portrait" x-show="current().art" :src="current().art" width="64" height="64" alt="" />
        <span class="portrait portrait-initials" x-show="!current().art" x-text="initials(current())"></span>
        <div>
          <h2 id="chat-title" x-text="title()"></h2>
          <p class="chat-desc" x-show="!chatGroup && current().description" x-text="current().description"></p>
          <p class="muted">
            <span x-text="chatConn"></span>
            <span x-text="chatMeta()"></span>
            <span class="warn" x-show="chatThinking">thinking…</span>
          </p>
          <p class="chat-activity muted" x-show="chatThinking && chatActivity" x-text="chatActivity"></p>
        </div>
      </div>
      <div class="row">
        <button type="button" class="btn" x-show="!chatGroup && chatThinking && current().runtime === 'rpc'" @click="stopAgent()">Stop</button>
        <button type="button" class="btn" :class="{ 'btn-ink': canvasOpen }" x-show="!chatGroup && canvasItems.length" x-cloak
                :aria-pressed="canvasOpen" @click="toggleCanvas()" x-text="'Canvas · ' + canvasItems.length"></button>
        <button type="button" class="btn" @click="closeChat()">Close</button>
      </div>
    </header>
    <div class="face-strip" aria-label="Switch chat">
      <template x-for="g in groups" :key="'g-' + g.id">
        <button type="button" class="rail-face rail-group" :class="{ 'is-open': chatGroup && chatGroup.id === g.id }"
                :aria-label="'Open group ' + g.name" @click="openGroup(g.id)">
          <template x-for="(f, i) in groupFaces(g)" :key="f.id">
          <span class="stack-face" :style="'--i:' + i"><img x-show="f.art" :src="f.art" alt="" /><span x-show="!f.art" x-text="initials(f)"></span></span>
          </template>
        </button>
      </template>
      <template x-for="t in rail.agents.concat(rail.workers)" :key="t.id">
        <button type="button" class="rail-face" :class="{ 'is-open': !chatGroup && chatId === t.id, 'rail-worker': !t.art }"
                :aria-label="'Chat with ' + t.label" @click="openChat(t.id)">
          <img x-show="t.art" :src="t.art" width="36" height="36" alt="" />
          <span x-show="!t.art" x-text="initials(t)"></span>
        </button>
      </template>
    </div>
    <div class="group-to" x-show="chatGroup" x-cloak>
      <span class="muted">To</span>
      <template x-for="id in (chatGroup ? chatGroup.members : [])" :key="id">
        <button type="button" class="btn" :class="{ 'btn-ink': groupTo === id }" @click="groupTo = id; focusComposer()"
                x-text="id + (chatGroup && chatGroup.lead === id ? ' (lead)' : '')"></button>
      </template>
    </div>
    <div class="chat-body" :class="{ 'has-canvas': canvasOpen && !chatGroup && canvasItems.length }">
    <section class="canvas-pane" aria-label="Canvas" x-show="canvasOpen && !chatGroup && canvasItems.length" x-cloak>
      <div class="canvas-tabs" role="tablist">
        <template x-for="it in canvasItems" :key="it.id">
          <button type="button" role="tab" class="chip" :aria-selected="canvasSel === it.id" :aria-pressed="canvasSel === it.id"
                  @click="canvasSel = it.id" x-text="it.title"></button>
        </template>
      </div>
      <template x-if="canvasItem()">
        <div class="canvas-view">
          <p class="canvas-caption" x-show="canvasItem().caption" x-text="canvasItem().caption"></p>
          <template x-if="canvasItem().kind === 'image'">
            <div class="canvas-images" :class="{ 'is-set': (canvasItem().images || []).length > 1 }">
              <template x-for="img in (canvasItem().images || [])" :key="img.file">
                <figure class="canvas-figure">
                  <a :href="canvasSrc(canvasItem(), img.file)" target="_blank" rel="noopener"><img :src="canvasSrc(canvasItem(), img.file)" :alt="img.label" loading="lazy" /></a>
                  <figcaption class="row">
                    <span x-text="img.label"></span>
                    <button type="button" class="btn btn-ink" x-show="canvasItem().choose" @click="pickCanvasImage(canvasItem(), img)">Pick</button>
                  </figcaption>
                </figure>
              </template>
            </div>
          </template>
          <template x-if="canvasItem().kind !== 'image'">
            <div class="canvas-frame-wrap">
              <iframe x-ref="canvasFrame" class="canvas-frame" :src="canvasFrameSrc(canvasItem())" :sandbox="canvasSandbox(canvasItem())"
                      :title="canvasItem().title" referrerpolicy="no-referrer"></iframe>
              <a class="canvas-open muted" x-show="canvasItem().kind === 'url' || canvasItem().kind === 'html'" :href="canvasFrameSrc(canvasItem())" target="_blank" rel="noopener">Open in a new tab</a>
            </div>
          </template>
        </div>
      </template>
    </section>
    <div class="thread" x-ref="chatLog" aria-live="polite">
      <div class="bubble-row is-system" x-show="chatEmpty" x-cloak>
        <div class="bubble"><p x-text="title() + (chatGroup ? ' is on the line. Messages go to the lead unless you pick another member.' : ' is on the line.')"></p></div>
      </div>
    </div>
    </div>
    <div class="route-panel" x-show="routeNote" x-cloak>
      <p x-text="routeNote"></p>
      <div class="row-wrap" x-show="routeChoices.length">
        <template x-for="c in routeChoices" :key="c.key">
          <button type="button" class="btn" @click="pickRoute(c.key)"
                  x-text="c.label + (c.p != null ? ' · ' + Math.round(c.p * 100) + '%' : '')"></button>
        </template>
      </div>
      <button type="button" class="btn" @click="routeNote = ''; routeChoices = []">Dismiss</button>
    </div>
    <form class="chat-compose" @submit.prevent="sendChat">
      <img class="avatar" src="/art/captain.png" width="48" height="48" alt="" />
      <div class="composer">
        <button type="button" class="btn" :class="{ 'btn-ink': autoRoute }" :aria-pressed="autoRoute"
                title="Let Jev pick an agent, a group (its lead), or Firstmate" @click="autoRoute = !autoRoute">Auto</button>
        <textarea class="field chat-field" x-ref="chatField" x-model="chatDraft" rows="1" @input="growComposer()" @keydown.enter="composerEnter($event)" :placeholder="autoRoute ? 'Message — Jev picks who' : 'Message ' + current().label" autocomplete="off" :aria-label="autoRoute ? 'Message, routed by Jev (Shift+Enter for a new line)' : 'Message ' + current().label + ' (Shift+Enter for a new line)'"></textarea>
        <button class="btn btn-ink" type="submit">Send</button>
      </div>
    </form>
  </aside>

  <div class="palette-backdrop" x-show="paletteOpen" x-cloak @click="closePalette()"></div>
  <div class="palette" role="dialog" aria-label="Command palette" x-show="paletteOpen" x-cloak @click.stop>
    <p class="palette-title">Command</p>
    <input class="field palette-field" x-ref="paletteField" readonly aria-label="Command palette" />
    <ul class="palette-list" role="listbox">
      <template x-for="(item, idx) in paletteItems()" :key="item.id">
        <li>
          <button type="button" class="palette-item" :class="{ 'is-active': paletteIndex === idx }"
                  @click="runPaletteItem(idx)" x-text="item.label"></button>
        </li>
      </template>
    </ul>
  </div>

  <nav class="dock" aria-label="Fleet sections">
    <button type="button" class="dock-btn" :class="{ 'is-open': leaf === 'health' && !chatOpen }" @click="openLeaf('health')">
      <svg viewBox="0 0 22 22" aria-hidden="true"><path fill="currentColor" d="M9 2h4v7h7v4h-7v7H9v-7H2V9h7z"/></svg>
      Health
    </button>
    <button type="button" class="dock-btn" :class="{ 'is-open': leaf === 'fleet' && !chatOpen, 'is-ring': waiting }" @click="openLeaf('fleet')">
      <svg viewBox="0 0 22 22" aria-hidden="true"><path fill="currentColor" d="M10 2h2v3h5v2h-1l2 8H4l2-8H5V5h5V2zm-5 15h12v3H5z"/></svg>
      Fleet
    </button>
    <button type="button" class="dock-btn" :class="{ 'is-open': leaf === 'agents' && !chatOpen, 'is-ring': waiting }" @click="openLeaf('agents')">
      <svg viewBox="0 0 22 22" aria-hidden="true"><path fill="currentColor" d="M4 4h6v6H4zm8 0h6v6h-6zM4 12h6v6H4zm8 0h6v6h-6z"/></svg>
      Agents
    </button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
