id: architect
type: assistant
role: architect
harness: pi
# JetBrains Junie credits (until 2026-10-26): Claude Fable 5.1 for design
# work (Alice omni agent, game mechanics, voice). bin/launch checks the Junie
# balance at each start and uses fallback_model once credits run out: Grok on
# Cursor, which bills against the normal included usage.
model: junie/claude-fable-5-1
fallback_model: cursor/grok-4.7@256k
# Design conversations span days: keep one session across dashboard turns,
# idle stops, and the TUI (New session on the dashboard starts over).
dashboard_session: persistent
# A live Pi session in the dashboard's agent host (ask_captain dialogs, the
# canvas, voice); design turns read a lot of code, so allow up to 30 minutes.
runtime: rpc
turn_timeout: 1800
vault: /Users/avega/Workspace/brain
extensions:
  - cursor-sdk
  - hermes-memory
  - obsidian
skills:
  - obsidian-markdown
  - obsidian-bases
  - json-canvas
  - obsidian-cli
extra_prompts:
  - prompts/system/sr_opus_5_system_prompt.md
authority:
  allow:
    - plan-draft
    - plan-review
  deny:
    - merge
    - force-push
    - secrets
    - retire-home
    - spawn
