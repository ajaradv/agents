id: architect
type: assistant
role: architect
harness: pi
# Grok on Cursor for design work, billed with the normal Cursor charges.
# Backup: DeepSeek V4 Pro, used when Cursor refuses the request that day
# (for example its API usage pool and spend limit are both used up).
model: cursor/grok-4.7@256k
fallback_model: openrouter/deepseek/deepseek-v4-pro
# Design conversations span days: keep one session across dashboard turns,
# idle stops, and the TUI (New session on the dashboard starts over).
dashboard_session: persistent
# A live Pi session in the dashboard's agent host (ask_captain dialogs, the
# canvas, voice); design turns read a lot of code, so allow up to 30 minutes.
runtime: rpc
turn_timeout: 1800
vault: ~/Workspace/brain
extensions:
  - cursor-sdk
  - hermes-memory
  - obsidian
skills:
  - obsidian-markdown
  - obsidian-bases
  - json-canvas
  - obsidian-cli
extra_prompts:
  - prompts/system/sr_opus_5_system_prompt.md
authority:
  allow:
    - plan-draft
    - plan-review
  deny:
    - merge
    - force-push
    - secrets
    - retire-home
    - spawn
# Conversation mode voice (Gemini Live prebuilt voice; clear; matches bm_george).
live_voice: Iapetus
# No globally installed skills (AWS, archify, ...): they cost about 7k tokens a turn
# and no part of this role uses them. Repo skills come from skill_paths.
discover_skills: false
