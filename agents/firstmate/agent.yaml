id: firstmate
type: orchestrator
role: firstmate
harness: pi
# JetBrains Junie credits (until 2026-10-26): Claude Sonnet 5. bin/launch
# checks the Junie balance at each start and uses fallback_model once credits
# run out: the direct DeepSeek API, whose prompt caching keeps Firstmate's
# many wakes cheap (Cursor replays the session uncached).
model: junie/claude-sonnet-5
fallback_model: deepseek/deepseek-v4-pro
extensions:
  - fleet-dashboard-heartbeat
# Fewer, larger supervision wakes (vendor/firstmate/docs/configuration.md):
# escalation digests buffer 10 min (default 90s), a working-but-idle pane
# escalates after 15 min (default 240s), nearby signals coalesce for 2 min (30s).
env:
  FM_ESCALATE_BATCH_SECS: 600
  FM_STALE_ESCALATE_SECS: 900
  FM_SIGNAL_GRACE: 120
cwd: fleet/home
