id: firstmate
type: orchestrator
role: firstmate
harness: pi
# DeepSeek V4 Pro through OpenRouter (it holds the DeepSeek key), whose prompt
# caching keeps Firstmate's many wakes cheap (Cursor replays the session
# uncached). Backups: Composer on the Cursor key while Cursor is on, then Luna.
models: [deepseek-v4-pro, composer-2.5, luna]
extensions:
  # Compact between tasks once context passes 65%, after running /stow
  # (extensions/context-guard.ts), instead of at the edge of the window.
  - context-guard
  # Prompt-cache checks (prefix hash, miss alerts) and the repeated-read guard.
  - cache-watch
# Fewer, larger supervision wakes (vendor/firstmate/docs/configuration.md):
# escalation digests buffer 10 min (default 90s), a working-but-idle pane
# escalates after 15 min (default 240s), nearby signals coalesce for 2 min (30s).
env:
  FM_ESCALATE_BATCH_SECS: 600
  FM_STALE_ESCALATE_SECS: 900
  FM_SIGNAL_GRACE: 120
  FLEET_STOW_BEFORE_COMPACT: 1
  FLEET_COMPACT_FOCUS: "Keep every open task and its state, captain holds and their questions, workers in flight with their task ids and branches, promised replies, and the captain's latest instructions verbatim."
cwd: fleet/home
# Conversation mode voice (Gemini Live prebuilt voice; informative; matches am_michael).
live_voice: Charon
