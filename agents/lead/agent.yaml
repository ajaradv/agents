id: lead
type: assistant
role: lead
harness: pi
# DeepSeek V4 Pro: the lead takes the most turns and keeps the longest
# session, so it needs real prompt caching (not Cursor). Through OpenRouter,
# which holds the DeepSeek key. Backups: Composer on the Cursor key while Cursor
# is on (uncached, so only for a bad day), then Luna.
models: [deepseek-v4-pro, composer-2.5, luna]
# crew: only — exists only aboard ships, as <ship>-lead.
crew: only
# Branch names and commit messages in the conventional form python-semantic-release reads.
skill_paths:
  - skills/git-conventions
# Conversation mode voice (Gemini Live prebuilt voice; even; matches bm_fable).
live_voice: Schedar
# No globally installed skills (AWS, archify, ...): they cost about 7k tokens a turn
# and no part of this role uses them. Repo skills come from skill_paths.
discover_skills: false
# pi's read-only grep, find and ls are off by default: the officers' fallback beside their typed
# tools (plan alice-memory-and-tools, M5). Bash stays for now; it comes out (-bash) after a week
# of measured use (bin/fleet-axi bash-use).
tools:
  - +grep
  - +find
  - +ls
