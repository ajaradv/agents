id: shipwright
type: assistant
role: shipwright
harness: pi
model: cursor/composer-2.5
workspace: repo
extensions:
  - cursor-sdk
skill_paths:
  - .claude/skills/sssf
extra_prompts:
  - prompts/system/sr_opus_5_system_prompt.md
authority:
  allow:
    - status
    - repo-edit
    - new-agent
    - stamp-ship-dry-run
  deny:
    - merge
    - force-push
    - secrets
    - retire-home
    - spawn
