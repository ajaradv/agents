id: alice
type: assistant
role: alice
harness: pi
# The fleet's omni agent (vault plan fleet/plans/feature/alice-omni-agent.md).
# Sonnet on Junie credits; bin/launch checks the balance at each start and
# uses fallback_model (Composer on Cursor's included usage) when they are gone.
model: junie/claude-sonnet-5
fallback_model: cursor/composer-2.5
# A live Pi session in the fleet node: streaming, steer mid-turn, ask_captain
# that waits. Dashboard turns and the TUI share one session.
runtime: rpc
dashboard_session: persistent
# Spend cap per day, checked against her turns in the fleet ship log.
daily_budget_usd: 6
vault: /Users/avega/Workspace/brain
vault_inbox: fleet/inbox
extensions:
  - cursor-sdk
  - hermes-memory
  - obsidian
  - fleet
skills:
  - obsidian-markdown
  - obsidian-bases
  - json-canvas
  - obsidian-cli
extra_prompts:
  - prompts/system/sr_opus_5_system_prompt.md
authority:
  allow:
    - fleet-read
    - fleet-chat
    - vault-file
    - status
    - steer
    - rerun
  deny:
    - merge
    - force-push
    - secrets
    - retire-home
    - spawn
    - repo-write
