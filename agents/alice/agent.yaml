id: alice
type: assistant
role: alice
harness: pi
# The fleet's omni agent (vault plan fleet/plans/feature/alice-omni-agent.md).
# DeepSeek V4 Pro through OpenRouter (it holds the DeepSeek key): a long-running
# session needs prefix caching, which DeepSeek applies automatically (Cursor
# replays the whole session uncached every turn).
# Backup on another provider: Composer on Cursor's included usage.
model: openrouter/deepseek/deepseek-v4-pro
fallback_model: cursor/composer-2.5
# A live Pi session in the fleet node: streaming, steer mid-turn, ask_captain
# that waits. Dashboard turns and the TUI share one session.
runtime: rpc
dashboard_session: persistent
# Conversation mode (lib/live-voice.ts): her Gemini Live voice, with agents/alice/character.md.
live_voice: Sulafat
# Spend cap per day, checked against her turns in the fleet ship log.
daily_budget_usd: 6
vault: ~/Workspace/brain
vault_inbox: fleet/inbox
# A light delegator: no Hermes (durable memory is files: captain profile,
# state/plan/notes, and recall), no Obsidian extension (built-in file tools
# cover the vault; deep vault work goes to a librarian helper). cursor-sdk is
# for her Composer backup.
extensions:
  - cursor-sdk
  - fleet
skills:
  - obsidian-markdown
  - obsidian-bases
# Only the skills above: the globally installed ones (AWS, archify, ...) were
# half her system prompt.
discover_skills: false
extra_prompts:
  - prompts/system/sr_opus_5_system_prompt.md
# Codemode and tool_search: rarely used fleet actions load on demand (lazy
# tools, FLEET_LAZY_TOOLS), and scripts can batch calls and filter big results
# so only the answer enters her context. pi's read-only grep, find and ls are
# off by default; they are her fallback beside the vault tools (plan
# alice-memory-and-tools, M1), until bash can go. Bash stays for now: it comes
# out (-bash) after a clean week of the gate and intent routing, after 2026-11-05
# (vault task fleet-memory-m3-no-bash).
tools:
  - +codemode
  - +tool_search
  - +grep
  - +find
  - +ls
env:
  FLEET_LAZY_TOOLS: 1
authority:
  allow:
    - fleet-read
    - fleet-chat
    - order-run
    - fleet-steer
    - vault-file
    - status
    - steer
    - rerun
  deny:
    - merge
    - force-push
    - secrets
    - retire-home
    - spawn
    - repo-write
