id: alice
type: assistant
role: alice
harness: pi
# The fleet's omni agent (vault plan fleet/plans/feature/alice-omni-agent.md).
# DeepSeek V4 Pro: a long-running session needs prefix caching, which DeepSeek
# applies automatically (Cursor replays the whole session uncached every turn).
# Backup on another provider: Composer on Cursor's included usage.
model: deepseek/deepseek-v4-pro
fallback_model: cursor/composer-2.5
# A live Pi session in the fleet node: streaming, steer mid-turn, ask_captain
# that waits. Dashboard turns and the TUI share one session.
runtime: rpc
dashboard_session: persistent
# Spend cap per day, checked against her turns in the fleet ship log.
daily_budget_usd: 6
vault: /Users/avega/Workspace/brain
vault_inbox: fleet/inbox
extensions:
  - cursor-sdk
  - hermes-memory
  - obsidian
  - fleet
skills:
  - obsidian-markdown
  - obsidian-bases
  - json-canvas
  - obsidian-cli
extra_prompts:
  - prompts/system/sr_opus_5_system_prompt.md
# Codemode and tool_search: rarely used fleet actions load on demand (lazy
# tools, FLEET_LAZY_TOOLS), and scripts can batch calls and filter big results
# so only the answer enters her context.
tools:
  - +codemode
  - +tool_search
env:
  FLEET_LAZY_TOOLS: 1
authority:
  allow:
    - fleet-read
    - fleet-chat
    - order-run
    - fleet-steer
    - vault-file
    - status
    - steer
    - rerun
  deny:
    - merge
    - force-push
    - secrets
    - retire-home
    - spawn
    - repo-write
