id: builder
type: assistant
role: builder
harness: pi
# Writes the code aboard a ship: logic, server, data, tests (the designer owns
# look and feel). DeepSeek V4 Pro through OpenRouter (it holds the DeepSeek key),
# like the lead: long sessions need real prompt caching. Backups: Composer on the
# Cursor key while Cursor is on (uncached, so only for a bad day), then Luna.
models: [deepseek-v4-pro, composer-2.5, luna]
# crew: only — exists only aboard ships, as <ship>-builder.
crew: only
# Branch names and commit messages in the conventional form python-semantic-release reads.
skill_paths:
  - skills/git-conventions
# Conversation mode voice (Gemini Live prebuilt voice; firm).
live_voice: Alnilam
# No globally installed skills (AWS, archify, ...): they cost about 7k tokens a turn
# and no part of this role uses them. Repo skills come from skill_paths.
discover_skills: false
