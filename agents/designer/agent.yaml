id: designer
type: assistant
role: designer
harness: pi
model: cursor/gpt-5.5@272k
workspace: ships
# Live session in the dashboard's agent host (pi --mode rpc), shared with the
# TUI (Start TUI on the dashboard, or just designer). turn_timeout only applies
# if runtime is switched back to headless.
runtime: rpc
dashboard_session: persistent
turn_timeout: 1800
extensions:
  - cursor-sdk
# Motion: official GSAP skills (vendor/gsap-skills), Designer only.
skill_paths:
  - vendor/gsap-skills/skills/gsap-core
  - vendor/gsap-skills/skills/gsap-timeline
  - vendor/gsap-skills/skills/gsap-scrolltrigger
  - vendor/gsap-skills/skills/gsap-plugins
  - vendor/gsap-skills/skills/gsap-utils
  - vendor/gsap-skills/skills/gsap-performance
  - vendor/gsap-skills/skills/gsap-react
  - vendor/gsap-skills/skills/gsap-frameworks
extra_prompts:
  - prompts/system/sr_opus_5_system_prompt.md
authority:
  allow:
    - status
    - design-records
    - design-review
    - ui-code
    - design-branch
  deny:
    - merge
    - force-push
    - secrets
    - retire-home
    - spawn
    - push
    - backend-code
