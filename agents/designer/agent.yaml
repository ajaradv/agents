id: designer
type: assistant
role: designer
harness: pi
model: cursor/gpt-5.5@272k
workspace: ships
# Design turns run impeccable end to end; give them room and keep one session
# shared with the TUI (Start TUI on the dashboard, or just designer).
turn_timeout: 1800
dashboard_session: persistent
extensions:
  - cursor-sdk
extra_prompts:
  - prompts/system/sr_opus_5_system_prompt.md
authority:
  allow:
    - status
    - design-records
    - design-review
    - ui-code
    - design-branch
  deny:
    - merge
    - force-push
    - secrets
    - retire-home
    - spawn
    - push
    - backend-code
