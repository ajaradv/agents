id: scout
type: assistant
role: scout
harness: pi
# Read-only recon aboard a ship: DeepSeek V4 Flash through OpenRouter (cached
# input is cheap). Backups: Composer on the Cursor key while Cursor is on, then Luna.
models: [deepseek-v4-flash, composer-2.5, luna]
# crew: only — exists only aboard ships (<ship>-scout), never on the rail by itself.
crew: only
# Conversation mode voice (Gemini Live prebuilt voice; upbeat; matches am_puck).
live_voice: Puck
# No globally installed skills (AWS, archify, ...): they cost about 7k tokens a turn
# and no part of this role uses them. Repo skills come from skill_paths.
discover_skills: false
