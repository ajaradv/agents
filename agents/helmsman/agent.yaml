id: helmsman
type: assistant
role: helmsman
harness: pi
# Reviews a ship's process after a voyage docks or when the captain asks:
# judgement over a digest the node builds, a few turns at a time.
# DeepSeek V4 Pro through OpenRouter (cached input is cheap); backups: Composer on
# Cursor while Cursor is on, then Luna.
models: [deepseek-v4-pro, composer-2.5, luna]
# crew: only — exists only aboard ships, as <ship>-helmsman.
crew: only
# Conversation mode voice (Gemini Live prebuilt voice; easy-going).
live_voice: Umbriel
# No globally installed skills (AWS, archify, ...): they cost about 7k tokens a turn
# and no part of this role uses them. Repo skills come from skill_paths.
discover_skills: false
# pi's read-only grep, find and ls are off by default: the officers' fallback beside their typed
# tools (plan alice-memory-and-tools, M5). Bash stays for now; it comes out (-bash) after a week
# of measured use (bin/fleet-axi bash-use).
tools:
  - +grep
  - +find
  - +ls
