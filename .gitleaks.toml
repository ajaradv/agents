title = "fleet hub"

# Default gitleaks rules. The allowlist below is only the synthetic
# placeholders in two unit tests (alphabet runs and one short sequential
# assignment used to assert redaction). A finding is ignored when the path
# matches AND the placeholder fragment matches, so a real key in those files
# still fails the scan.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic placeholders in dashboard unit tests (not live credentials)"
condition = "AND"
paths = [
  '''dashboard/lib/tool-gate\.test\.ts''',
  '''dashboard/lib/public-helper\.test\.ts''',
]
regexes = [
  '''abcdefghijklmnopqrstu''',
  '''abcdef123456''',
  '''1234567890abcdefgh''',
]
