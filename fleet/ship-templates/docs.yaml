# Template: a docs or content repo (Markdown, a static site). Light checks, no VM needed.
isolation: host
# Rigging (dashboard/lib/rig.ts): fetch the linter once before the crew starts.
rig:
  up:
    - npx --yes markdownlint-cli2 --help > /dev/null
checks:
  lint: npx --yes markdownlint-cli2 "**/*.md"
gates:
  dock: [lint]

# Routines (lib/routines.ts): the helm review skips itself while no helmsman is aboard.
routines:
  helm-review:
    title: Helmsman reviews the ship
    every: weekly fri 16:30
    job: helm-review
