# Template: a Python web app (Django or similar) with a JS frontend build, tests in Docker Compose.
# Built from pochteca. Adjust the commands to the repo's justfile after stamping.
isolation: vm
checks:
  pytest: just pytest
  lint: just lint
  frontend: npm ci && npm run build
gates:
  task: [pytest]
  dock: [frontend, pytest]
maneuvers:
  verify:
    checks: [lint, pytest, frontend]
    by: [lead, scout, designer]
