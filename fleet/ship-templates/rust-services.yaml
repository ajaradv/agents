# Template: Rust services in a cargo workspace.
isolation: vm
# Rigging (dashboard/lib/rig.ts): warm the build before the crew starts. Add services (docker compose up)
# and a ready URL when the workspace serves HTTP.
rig:
  up:
    - cargo build --workspace
checks:
  build: cargo build --workspace
  test: cargo test --workspace
  clippy: cargo clippy --workspace -- -D warnings
  fmt: cargo fmt --all -- --check
gates:
  task: [build, test]
  dock: [fmt, clippy, test]
maneuvers:
  verify:
    checks: [fmt, clippy, build, test]
    by: [lead, scout]

# Routines (lib/routines.ts): the helm review skips itself while no helmsman is aboard.
routines:
  helm-review:
    title: Helmsman reviews the ship
    every: weekly fri 16:30
    job: helm-review
