# Phone access to Herdr over Tailscale (docs/remote-ops.md, "Phone → laptop").
# Install: sudo cp fleet/config/sshd-phone.conf /etc/ssh/sshd_config.d/050-fleet-phone.conf
# The name sorts before macOS's 100-macos.conf, so these settings win.
# macOS starts sshd on demand on every interface, so keys only is what keeps
# it safe: no passwords, no root, only this user.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers avega
