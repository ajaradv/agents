id: kinwork
path: /Users/avega/Workspace/Kinwork
orchestrator: lead
# Crewmates: role templates from agents/<role>/ deployed aboard this ship as
# <ship>-<role> (persistent session, cwd = path). crew_models overrides a role's model.
crew:
  - lead
  - builder
factory: null
mode: no-mistakes-prod-only
# Where the captain opens the app: the webpack dev server, which proxies Django (:8000 alone has no CSS).
preview: http://localhost:3000
crew_budgets:
  lead: 3
  builder: 3
# Rigging (dashboard/lib/rig.ts; vault plan fleet/plans/feature/ship-rigging): each voyage gets its own stack
# (Compose project and port of its own, beside the captain's), migrated and seeded before the crew starts.
# .envs comes from this host's store, fleet/home/ships/kinwork/env/kinwork/.envs. Celery is not started.
rig:
  env: [kinwork/.envs]
  vars:
    COMPOSE_FILE: docker-compose.local.yml:docker-compose.voyage.yml
  up:
    - cd kinwork && docker compose up -d --build postgres redis mailpit
    - cd kinwork && docker compose run --rm django python manage.py migrate --noinput
    - cd kinwork && docker compose run --rm django python manage.py seed_demo
    - cd kinwork && docker compose up -d --build node
  ready: http://localhost:${FLEET_RIG_PORT}/search/
  down: cd kinwork && docker compose down -v --rmi local
# Checks run in the voyage's worktree on its host (lib/ship-checks.ts), the same as CI's ruff, format,
# migrations, and pytest jobs, in the voyage's stack (COMPOSE_FILE and the project come from the rig).
# Ruff is pinned to kinwork/uv.lock's version. Two tests read files or env only CI has (docs/ outside the
# container mount, AWS keys unset), so they are left to CI.
checks:
  lint: cd kinwork && uvx ruff@0.16.10 check . && uvx ruff@0.16.10 format --check .
  fix-lint: cd kinwork && { uvx ruff@0.16.10 check --fix -q . ; uvx ruff@0.16.10 format -q . ; } && git add -u . && { git diff --cached --quiet || git commit -qm "style(ruff) fix and format"; } && uvx ruff@0.16.10 check . && uvx ruff@0.16.10 format --check .
  migrations: cd kinwork && { test -d .envs || cp -R "$FLEET_SHIP_REPO/kinwork/.envs" . ; } && docker compose run --rm django python manage.py makemigrations --check --dry-run
  pytest: cd kinwork && { test -d .envs || cp -R "$FLEET_SHIP_REPO/kinwork/.envs" . ; } && docker compose run --rm django pytest kinwork -q -p no:warnings --deselect kinwork/ingest/tests/test_demo_warmup.py::test_launch_documents_the_ssm_docker_exec --deselect kinwork/site/tests/test_launch.py::test_empty_aws_keys_leave_boto3_on_the_instance_role
# A task is done only with lint and migrations green on its commit; a voyage docks only with lint, migrations, and pytest green.
gates:
  task: [lint, migrations]
  dock: [lint, migrations, pytest]
# tidy: the deterministic lint fix (ruff's safe fixes and the formatter, committed), then what is left to fix by hand.
# rig (added by the fleet): set the voyage's stack up again (after a rebase or a new migration).
maneuvers:
  tidy:
    checks: [fix-lint]
    by: [lead, builder]
  verify:
    checks: [lint, migrations, pytest]
    by: [lead, builder, scout]
